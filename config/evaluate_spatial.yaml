tags:
  - ActivePoV
  # - ActivePoV
  # - ActiveRot
  # - ActiveE2A

num_per_task: 20

override: false  # whether to use active explore history, only valid when task is active task
evaluate_cogmap: false

defaults:
  - base
  - envs_spatial
  - evaluate_api_llm

output_dir: results/gpt-4.1-mini/0901_active_pov

eval_model_type: api # api or vllm
# api model
api_model_info:
  model_name: gpt-4.1-mini # o4-mini
  max_concurrency: 128

# vllm model
model_path: Qwen/Qwen2.5-3B-Instruct
actor_rollout_ref:
  rollout:
    max_model_len: 10000
    gpu_memory_utilization: 0.8
    val_kwargs: # for vllm
      temperature: 0
      top_p: 1

agent_proxy:
  max_turn: 20 # should be same as max_actions_per_traj
  action_sep: "||"
  max_actions_per_turn: 1 # how many actions can be output at most in a single turn
  enable_think: true

es_manager:
  val:
    env_groups: ${mul:${len:${tags}}, ${num_per_task}}
    group_size: 1
    env_configs:
        # tags: ["ActiveDir", "ActivePoV", "ActiveRot", "ActiveRotDual", "ActiveE2A"]
        tags: ${tags}
        n_groups: ${repeat:${num_per_task}, ${len:${tags}}}
        # Optional: per-tag base seeds; expanded per tag across its n_groups. Defaults to all 42s.
        group_seeds: ${repeat:42, ${len:${tags}}}
