_common: &common
  env_type: SpatialGym
  max_actions_per_traj: 1
  env_instruction: "You are solving a spatial question."
  max_tokens: 256

# prompt
_prompt_standard: &prompt_standard
  prompt_config:
    topdown: false
    cogmap: false
    type: standard

_prompt_cogmap: &prompt_cogmap
  prompt_config:
    topdown: false
    cogmap: true
    type: standard
  cogmap_config:
    cogmap_type: standard
    pos_allow_scale: true
    scope: all

_prompt_topdown: &prompt_topdown
  prompt_config:
    topdown: true
    cogmap: false
    type: standard

# exp_type
_passive: &passive
  exp_type: passive
  n_objects: 8
  level: 2 # 0, 1, 2
  main: 5 # 12, 7, 5
  room_size: [20, 20]
  proxy_agent_config:
    type: analyst
    delegate: observer_analyst
    observer_delegate: strategist


_active: &active
  exp_type: active
  n_objects: 8
  max_exp_steps: 15
  room_size: [15, 15]
  level: 2
  main: 6

custom_envs:
  PassiveDir:
    <<: *common
    env_config:
      <<: *prompt_standard
      <<: *passive
      name: "passive_dir"
      eval_tasks: [{task_type: "dir", task_kwargs: {}}]

  PassiveRot:
    <<: *common
    env_config:
      <<: *prompt_standard
      <<: *passive
      name: "passive_rot"
      eval_tasks: [{task_type: "rot", task_kwargs: {}}]

  PassiveRotDual:
