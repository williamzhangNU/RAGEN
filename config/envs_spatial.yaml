  PassiveLoc:
    <<: *common
    env_config:
      <<: *prompt_standard
      <<: *passive
      name: "passive_loc"
      eval_tasks: [{task_type: "loc", task_kwargs: {'only_main_room': False}}]

  PassiveE2A:
